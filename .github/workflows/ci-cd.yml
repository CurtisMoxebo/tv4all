name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend CI (Install, Lint/Typecheck, Test, Build)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend (Node.js & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Type-check and build backend
        run: npm --prefix backend run build

      - name: Run backend regression tests
        run: npm --prefix backend test

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: Frontend CI (Install, Build, Test)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend (React & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Type-check and build frontend
        run: npm --prefix frontend run build

      - name: Run frontend regression tests
        run: npm --prefix frontend test

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # -------------------------------------------------------------
  # Job 3: Package & Release Preparation (CD Phase)
  # -------------------------------------------------------------
  package-release:
    name: Package Production Bundle
    needs: [ backend-ci, frontend-ci ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: release/backend/dist

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend/dist

      - name: Assemble production bundle
        run: |
          mkdir -p release/backend release/frontend
          cp backend/package.json release/backend/
          cp backend/package-lock.json release/backend/
          cp backend/.env.example release/backend/
          cp -r backend/dist release/backend/
          cp -r frontend/dist release/frontend/
          if [ -f "index.m3u8" ]; then
            cp index.m3u8 release/
          fi
          echo "Production bundle structure:"
          find release -maxdepth 3

      - name: Upload production release archive
        uses: actions/upload-artifact@v4
        with:
          name: tv4all-production-release
          path: release/
          retention-days: 14

