name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =============================================================
  # 1. Backend Regression Tests
  # =============================================================
  backend-tests:
    name: "Backend: Regression Tests (67 tests)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run Backend Regression Tests (node:test)
        run: npm --prefix backend test

      - name: Generate Backend Test Summary
        if: always()
        run: |
          echo "### 🟢 Backend Regression Tests" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: Node.js native test runner (\`node:test\`) + \`supertest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suites**: 5 suites (M3U Parser, Authentication/JWT, Channels CRUD, Logger, Stream/Health)" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tests**: 67 automated test cases" >> $GITHUB_STEP_SUMMARY

  # =============================================================
  # 2. Backend Build
  # =============================================================
  backend-build:
    name: "Backend: Build (TypeScript tsc)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Build backend
        run: npm --prefix backend run build

      - name: Verify build artifacts
        run: |
          if [ ! -f "backend/dist/index.js" ]; then
            echo "Error: backend/dist/index.js was not generated!"
            exit 1
          fi
          echo "Backend build output verified:"
          ls -la backend/dist

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # =============================================================
  # 3. Frontend Regression Tests
  # =============================================================
  frontend-tests:
    name: "Frontend: Regression Tests (39 tests)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run Frontend Regression Tests (Vitest)
        run: npm --prefix frontend test

      - name: Generate Frontend Test Summary
        if: always()
        run: |
          echo "### 🟢 Frontend Regression Tests" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: Vitest + React Testing Library + jsdom" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suites**: 11 suites (Components, Pages, Context, i18n)" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tests**: 39 automated test cases" >> $GITHUB_STEP_SUMMARY

  # =============================================================
  # 4. Frontend Build
  # =============================================================
  frontend-build:
    name: "Frontend: Build (Vite & Tailwind)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Verify build artifacts
        run: |
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "Error: frontend/dist/index.html was not generated!"
            exit 1
          fi
          echo "Frontend build output verified:"
          ls -la frontend/dist

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # =============================================================
  # 5. Continuous Deployment: Deploy to Windows Server (IIS)
  # =============================================================
  deploy-iis:
    name: "Deploy Backend to IIS Server"
    needs: [ backend-tests, backend-build ]
    runs-on: self-hosted
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout latest main branch
        shell: powershell
        run: |
          cd C:\tv4all
          git fetch origin
          git reset --hard origin/main

      - name: Install backend production dependencies
        shell: powershell
        run: |
          cd C:\tv4all
          npm --prefix backend ci --omit=dev

      - name: Compile backend TypeScript
        shell: powershell
        run: |
          cd C:\tv4all
          npm --prefix backend run build

      - name: Recycle IIS Application Pool (Zero-Downtime Reload)
        shell: powershell
        run: |
          # Touching web.config automatically triggers an instant iisnode reload
          (Get-Item "C:\tv4all\backend\web.config").LastWriteTime = Get-Date
          Write-Host "Triggered IIS backend hot reload."

      - name: Health Verification
        shell: powershell
        run: |
          Start-Sleep -Seconds 3
          $health = Invoke-RestMethod -Uri "http://localhost:8001/api/health" -Method Get
          Write-Host "IIS Backend Status: $($health.status)"
