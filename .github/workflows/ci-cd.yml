name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =============================================================
  # 1. Backend Regression Tests
  # =============================================================
  backend-tests:
    name: "Backend: Regression Tests (67 tests)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run Backend Regression Tests (node:test)
        run: npm --prefix backend test

      - name: Generate Backend Test Summary
        if: always()
        run: |
          echo "### 🟢 Backend Regression Tests" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: Node.js native test runner (\`node:test\`) + \`supertest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suites**: 5 suites (M3U Parser, Authentication/JWT, Channels CRUD, Logger, Stream/Health)" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tests**: 67 automated test cases" >> $GITHUB_STEP_SUMMARY

  # =============================================================
  # 2. Backend Build
  # =============================================================
  backend-build:
    name: "Backend: Build (TypeScript tsc)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Build backend
        run: npm --prefix backend run build

      - name: Verify build artifacts
        run: |
          if [ ! -f "backend/dist/index.js" ]; then
            echo "Error: backend/dist/index.js was not generated!"
            exit 1
          fi
          echo "Backend build output verified:"
          ls -la backend/dist

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # =============================================================
  # 3. Frontend Regression Tests
  # =============================================================
  frontend-tests:
    name: "Frontend: Regression Tests (38 tests)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run Frontend Regression Tests (Vitest)
        run: npm --prefix frontend test

      - name: Generate Frontend Test Summary
        if: always()
        run: |
          echo "### 🟢 Frontend Regression Tests" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: Vitest + React Testing Library + jsdom" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suites**: 10 suites (Components, Pages, Context, i18n)" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tests**: 38 automated test cases" >> $GITHUB_STEP_SUMMARY

  # =============================================================
  # 4. Frontend Build
  # =============================================================
  frontend-build:
    name: "Frontend: Build (Vite & Tailwind)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Verify build artifacts
        run: |
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "Error: frontend/dist/index.html was not generated!"
            exit 1
          fi
          echo "Frontend build output verified:"
          ls -la frontend/dist

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # =============================================================
  # 5. Continuous Delivery: Package Production Release
  # =============================================================
  package-release:
    name: "Package Release Bundle (CD)"
    needs: [ backend-tests, backend-build, frontend-tests, frontend-build ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: release/backend/dist

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend/dist

      - name: Assemble production bundle
        run: |
          mkdir -p release/backend release/frontend
          cp backend/package.json release/backend/
          cp backend/package-lock.json release/backend/
          cp backend/.env.example release/backend/
          cp -r backend/dist release/backend/
          cp -r frontend/dist release/frontend/
          if [ -f "index.m3u8" ]; then
            cp index.m3u8 release/
          fi
          echo "### 📦 Production Bundle Assembled" >> $GITHUB_STEP_SUMMARY
          echo "- All 105 regression tests passed (67 backend, 38 frontend)." >> $GITHUB_STEP_SUMMARY
          echo "- Backend and frontend builds completed and verified." >> $GITHUB_STEP_SUMMARY
          echo "- Production bundle packaged for deployment." >> $GITHUB_STEP_SUMMARY

      - name: Upload production release archive
        uses: actions/upload-artifact@v4
        with:
          name: tv4all-production-release
          path: release/
          retention-days: 14
