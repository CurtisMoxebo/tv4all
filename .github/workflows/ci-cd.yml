name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =============================================================
  # 1. Backend Regression Tests & Code Coverage
  # =============================================================
  backend-tests:
    name: "Backend: Regression Tests & Coverage (77 tests)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run Backend Regression Tests & Coverage (node:test + c8)
        run: npm --prefix backend run test:coverage

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/
          retention-days: 14

      - name: Generate Backend Test & Coverage Summary
        if: always()
        run: |
          echo "### 🟢 Backend Regression Tests & Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: Node.js native test runner (\`node:test\`) + \`supertest\` + \`c8\` (V8 coverage)" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suites**: 6 suites (M3U Parser, Authentication/JWT, Channels CRUD, Logger, Stream/Health, EPG)" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tests**: 77 automated test cases" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "backend/coverage/coverage-summary.json" ]; then
            echo "#### 📊 Backend Coverage Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const s = require('./backend/coverage/coverage-summary.json').total;
              console.log('| Metric | Covered | Total | Percentage |');
              console.log('| :--- | :---: | :---: | :---: |');
              console.log('| **Statements** | ' + s.statements.covered + ' | ' + s.statements.total + ' | ' + s.statements.pct + '% |');
              console.log('| **Branches** | ' + s.branches.covered + ' | ' + s.branches.total + ' | ' + s.branches.pct + '% |');
              console.log('| **Functions** | ' + s.functions.covered + ' | ' + s.functions.total + ' | ' + s.functions.pct + '% |');
              console.log('| **Lines** | ' + s.lines.covered + ' | ' + s.lines.total + ' | ' + s.lines.pct + '% |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "*(Coverage report artifact uploaded: see backend-coverage-report below)*" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================
  # 2. Backend Build
  # =============================================================
  backend-build:
    name: "Backend: Build (TypeScript tsc)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Build backend
        run: npm --prefix backend run build

      - name: Verify build artifacts
        run: |
          if [ ! -f "backend/dist/index.js" ]; then
            echo "Error: backend/dist/index.js was not generated!"
            exit 1
          fi
          echo "Backend build output verified:"
          ls -la backend/dist

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # =============================================================
  # 3. Frontend Regression Tests & Code Coverage
  # =============================================================
  frontend-tests:
    name: "Frontend: Regression Tests & Coverage (44 tests)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run Frontend Regression Tests & Coverage (Vitest)
        run: npm --prefix frontend run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 14

      - name: Generate Frontend Test & Coverage Summary
        if: always()
        run: |
          echo "### 🟢 Frontend Regression Tests & Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: Vitest + React Testing Library + jsdom + V8 coverage" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suites**: 12 suites (Components, Pages, Context, i18n, EPG)" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tests**: 44 automated test cases" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "frontend/coverage/coverage-summary.json" ]; then
            echo "#### 📊 Frontend Coverage Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const s = require('./frontend/coverage/coverage-summary.json').total;
              console.log('| Metric | Covered | Total | Percentage |');
              console.log('| :--- | :---: | :---: | :---: |');
              console.log('| **Statements** | ' + s.statements.covered + ' | ' + s.statements.total + ' | ' + s.statements.pct + '% |');
              console.log('| **Branches** | ' + s.branches.covered + ' | ' + s.branches.total + ' | ' + s.branches.pct + '% |');
              console.log('| **Functions** | ' + s.functions.covered + ' | ' + s.functions.total + ' | ' + s.functions.pct + '% |');
              console.log('| **Lines** | ' + s.lines.covered + ' | ' + s.lines.total + ' | ' + s.lines.pct + '% |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "*(Coverage report artifact uploaded: see frontend-coverage-report below)*" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================
  # 4. Frontend Build
  # =============================================================
  frontend-build:
    name: "Frontend: Build (Vite & Tailwind)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Verify build artifacts
        run: |
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "Error: frontend/dist/index.html was not generated!"
            exit 1
          fi
          echo "Frontend build output verified:"
          ls -la frontend/dist

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # =============================================================
  # 5. Continuous Deployment: Deploy to Windows Server (IIS)
  # =============================================================
  deploy-iis:
    name: "Deploy Backend & Frontend to IIS Server"
    needs: [ backend-tests, backend-build, frontend-tests, frontend-build ]
    runs-on: self-hosted
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout latest main branch
        shell: powershell
        run: |
          git config --global --add safe.directory C:/Projects/tv4all
          git config --global --add safe.directory '*'
          cd C:\Projects\tv4all
          Get-ChildItem -Path C:\Projects\tv4all -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object { if ($_.IsReadOnly) { $_.IsReadOnly = $false } }
          git fetch origin
          git reset --hard origin/main

      - name: Install dependencies & build backend
        shell: powershell
        run: |
          cd C:\Projects\tv4all
          npm --prefix backend ci
          npm --prefix backend run build

      - name: Install dependencies & build frontend
        shell: powershell
        run: |
          cd C:\Projects\tv4all
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Recycle IIS Backend Application Pool (Zero-Downtime Reload)
        shell: powershell
        run: |
          # Touching web.config automatically triggers an instant iisnode reload
          (Get-Item "C:\Projects\tv4all\backend\web.config").LastWriteTime = Get-Date
          Write-Host "Triggered IIS backend hot reload."

      - name: Health Verification
        shell: powershell
        run: |
          Start-Sleep -Seconds 3
          $health = Invoke-RestMethod -Uri "http://localhost:8001/api/health" -Method Get
          Write-Host "IIS Backend Status: $($health.status)"
          try {
            $frontend = Invoke-WebRequest -Uri "http://localhost:8002" -UseBasicParsing -TimeoutSec 5
            Write-Host "IIS Frontend Status: $($frontend.StatusCode)"
          } catch {
            Write-Host "IIS Frontend (port 8002) check: $($_.Exception.Message)"
          }
